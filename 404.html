<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — лендинги Диловара Сидикова</title>
<meta name="description" content="Такой страницы нет. Зайдите на главную или на полку с разбором проектов.">
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Manrope';src:url('fonts/manrope-cyrillic.woff2') format('woff2');font-weight:200 800;font-style:normal;font-display:swap;unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';src:url('fonts/manrope-latin.woff2') format('woff2');font-weight:200 800;font-style:normal;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#16130f;--paper:#faf6ef;--accent:#b4552d;--line:#e2d9c8}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{max-width:520px;text-align:center}
.code{font-size:clamp(72px,18vw,140px);font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--accent)}
h1{font-size:clamp(22px,4vw,30px);font-weight:700;margin:16px 0 12px}
p{font-size:16px;line-height:1.55;color:#5c5347;margin-bottom:28px}
nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:14px 26px;min-height:48px;border-radius:10px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--ink);transition:transform .15s ease,background .15s ease}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
a.primary{background:var(--ink);color:var(--paper)}
a.ghost{background:transparent;color:var(--ink)}
a:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<main class="card">
  <div class="code" aria-hidden="true">404</div>
  <h1>Страница не найдена</h1>

  <nav>
    <a class="primary" href="index.html">На главную</a>
    <a class="ghost" href="showcase.html">Разбор проектов</a>
  </nav>
</main>
</body>
</html>
